<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProConnect HR — Giriş</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:#eef2f6;color:#1b2733;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:400px;background:#fff;border-radius:16px;
        box-shadow:0 10px 40px rgba(11,39,64,.12);overflow:hidden}
  .top{background:linear-gradient(135deg,#0b5cab,#1aa3a3);padding:30px 32px;color:#fff}
  .top .logo{font-size:20px;font-weight:700;letter-spacing:.3px}
  .top .sub{font-size:13px;opacity:.9;margin-top:4px}
  .body{padding:28px 32px 32px}
  .hi{font-size:15px;color:#31475a;margin:0 0 20px;line-height:1.5}
  .hi b{color:#0b2740}
  label{display:block;font-size:13px;font-weight:600;color:#43596b;margin:14px 0 6px}
  input{width:100%;padding:12px 14px;font-size:15px;border:1px solid #d3dde6;border-radius:9px;outline:none;transition:.15s}
  input:focus{border-color:#0b5cab;box-shadow:0 0 0 3px rgba(11,92,171,.12)}
  .btn{width:100%;margin-top:22px;padding:13px;font-size:15px;font-weight:600;color:#fff;
       background:#0b5cab;border:none;border-radius:9px;cursor:pointer;transition:.15s}
  .btn:hover{background:#094c8e}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px}
  .row a{color:#0b5cab;text-decoration:none}
  .lock{color:#5f7183;display:flex;align-items:center;gap:6px}
  .foot{text-align:center;font-size:11.5px;color:#8a97a5;margin-top:22px}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="logo">ProConnect HR</div>
      <div class="sub">Performans &amp; Əmək Haqqı Portalı</div>
    </div>
    <div class="body">
      <p class="hi">Salam, <b>{{.FirstName}}</b> 👋<br>Nəticənizə baxmaq üçün korporativ hesabınızla daxil olun.</p>
      <form action="{{.SubmitURL}}" method="post" autocomplete="off">
        <label for="u">Korporativ e-poçt</label>
        <input id="u" name="username" type="email" placeholder="ad.soyad@prosol.az" required>
        <label for="p">Parol</label>
        <input id="p" name="password" type="password" placeholder="••••••••" required>
        <button class="btn" type="submit">Daxil ol və təsdiqlə</button>
      </form>
      <div class="row">
        <span class="lock">🔒 Təhlükəsiz bağlantı</span>
        <a href="#">Parolu unutmusunuz?</a>
      </div>
      <div class="foot">© 2026 ProConnect HR · Bakı</div>
    </div>
  </div>
</body>
</html>
