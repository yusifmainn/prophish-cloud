{{template "head" .}}
<main>
  <div class="center">
    {{template "authbrand" .}}
    <div class="card">
      <h1>{{t "setup.title"}}</h1>
      <p class="muted">{{t "setup.subtitle"}}</p>
      {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
      <form method="post" action="/setup">
        <label for="email">{{t "setup.email"}}</label>
        <input id="email" type="email" name="email" required autofocus autocomplete="username">
        <label for="password">{{t "setup.password"}}</label>
        <input id="password" type="password" name="password" required minlength="12" autocomplete="new-password">
        <div class="hint">{{t "setup.min_chars"}}</div>
        <button type="submit">{{t "setup.create_account"}}</button>
      </form>
    </div>
  </div>
</main>
{{template "foot" .}}
